<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commerce Copilot · 电商客服工作台</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><aside><a class="brand" href="/">C<span>Commerce<br><small>COPILOT</small></span></a><div class="section">工作空间</div><button class="nav active" id="new-chat">◈ &nbsp; 客服助手 <span>＋</span></button><div class="nav muted">▧ &nbsp; 商品知识库 <small>6 款模拟商品</small></div><div class="nav muted">▤ &nbsp; 订单数据 <small>2 笔模拟订单</small></div><div class="side-note"><b>为客服多想一步。</b><p>检索商品、核对订单、辅助运营，让每次回复都有依据。</p></div><footer><span class="avatar">店</span><div>演示店铺<small>求职作品 · 只读工作空间</small></div></footer></aside>
<main><header><div><span class="crumb">工作空间 /</span> 客服助手</div><span class="status" id="mode">正在连接…</span></header><div class="workspace"><section id="welcome"><div class="eyebrow">YOUR COMMERCE, CONNECTED</div><h1>把繁杂交给助手，<br>把用心留给顾客<span>。</span></h1><p class="subtitle">从一条客户咨询，到一次选品决策。<br>让商品、订单与经营数据，在对话中连接起来。</p><div class="cards"><button data-prompt="店铺支持什么退货政策？"><i>↔</i><b>智能客服</b><span>快速检索售后与配送政策</span><em>查询退货政策 ↗</em></button><button data-prompt="推荐300元以内适合通勤的商品"><i>✧</i><b>商品推荐</b><span>按预算与使用场景筛选商品</span><em>找到合适的商品 ↗</em></button><button data-prompt="分析当前商品的选品优先级"><i>▥</i><b>选品分析</b><span>对比销量、毛利与退货表现</span><em>查看经营数据 ↗</em></button><button data-prompt="为云感降噪耳机生成商品文案"><i>✎</i><b>商品文案</b><span>基于真实字段整理商品卖点</span><em>写一份文案草稿 ↗</em></button></div><button class="order" data-prompt="查询订单 DEMO1001">▤ &nbsp; 查询演示订单 <b>DEMO1001</b><span>查看物流进度 →</span></button></section><section id="messages" aria-live="polite" aria-label="对话记录"></section></div><div class="composer-wrap"><div id="error" role="alert"></div><form id="composer"><label class="sr-only" for="input">发送消息</label><textarea id="input" maxlength="2000" rows="2" placeholder="输入客户的问题，或让助手帮你分析商品…"></textarea><div class="composer-bottom"><span>◈ &nbsp; 商品 · 订单 · 店铺知识</span><button id="send" type="submit" aria-label="发送消息">↑</button></div></form><p class="disclaimer">所有商品、订单及经营指标均为模拟数据 · 回答与文案请经人工核对</p></div></main></body></html>
